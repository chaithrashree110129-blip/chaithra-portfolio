<style id="chaithra-motion-sites">
:root{--cr-bg:#170307;--cr-bg2:#1b0509;--cr-line:rgba(255,120,120,.16);--cr-accent:#ff5b4d;--cr-gold:#ffad2f;--cr-text:#f6eaea}
html,body,#root{background:var(--cr-bg)!important;color:var(--cr-text)}
html{scroll-behavior:smooth}
body{overflow-x:hidden}
/* Plain dark-red canvas: remove patterned/grid backgrounds from the original theme. */
body::before,body::after,#root::before,#root::after{display:none!important;content:none!important}
#root>div{background:var(--cr-bg)!important}
section{background:var(--cr-bg)!important}
/* Scroll progress */
#cr-progress{position:fixed;left:0;top:0;width:0;height:3px;background:linear-gradient(90deg,#ff4d5a,#ffb020);z-index:999999;box-shadow:0 0 18px rgba(255,77,90,.7);pointer-events:none}
/* Cursor light */
#cr-glow{position:fixed;width:340px;height:340px;border-radius:50%;pointer-events:none;z-index:0;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,72,72,.13),rgba(255,150,40,.05) 38%,transparent 70%);filter:blur(4px);mix-blend-mode:screen}
/* Entrance reveal */
.cr-reveal{opacity:0;transform:translateY(55px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.cr-reveal.cr-show{opacity:1;transform:none}
.cr-letter{display:inline-block;opacity:0;transform:translateY(90px) rotate(8deg);filter:blur(7px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1),filter .7s ease}
.cr-letter.cr-show{opacity:1;transform:none;filter:blur(0)}
/* Hero */
.cr-hero-title{perspective:900px}
.cr-hero-title .cr-letter:hover{transform:translateY(-10px) rotate(-2deg) scale(1.04);text-shadow:0 0 35px rgba(255,83,70,.35)}
/* Floating 3D/decorative elements */
.cr-float{animation:crFloat 5.5s ease-in-out infinite;will-change:transform}
.cr-float:nth-child(2n){animation-delay:-1.8s;animation-duration:6.5s}
.cr-float:nth-child(3n){animation-delay:-3.2s;animation-duration:7.2s}
@keyframes crFloat{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(0,-18px,0) rotate(3deg)}}
/* Buttons */
.cr-magnetic{will-change:transform;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s ease}
.cr-magnetic:hover{box-shadow:0 14px 45px rgba(255,82,70,.22)}
/* Cards */
.cr-card{transform-style:preserve-3d;will-change:transform;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,border-color .35s ease}
.cr-card:hover{box-shadow:0 28px 70px rgba(0,0,0,.35);border-color:rgba(255,130,100,.4)!important}
.cr-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.09) 50%,transparent 65%);transform:translateX(-120%);transition:transform .9s ease}
.cr-card:hover::after{transform:translateX(120%)}
/* Scroll-scaled project stack */
.cr-project-wrap{transform-origin:center top;transition:transform .18s linear;will-change:transform}
/* Marquee */
.cr-marquee{overflow:hidden;white-space:nowrap;border-top:1px solid var(--cr-line);border-bottom:1px solid var(--cr-line);padding:18px 0;background:var(--cr-bg)}
.cr-track{display:inline-flex;gap:38px;min-width:max-content;animation:crMarquee 22s linear infinite}
.cr-track span{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(1.1rem,2.5vw,2.2rem);color:rgba(246,234,234,.78)}
.cr-track b{color:#ff7b57}
@keyframes crMarquee{to{transform:translateX(-50%)}}
.cr-marquee:hover .cr-track{animation-play-state:paused}
/* Section headings */
.cr-heading{overflow:hidden}
.cr-heading .cr-letter{transform:translateY(70px)}
/* Nav */
nav a{position:relative}
nav a::after{content:"";position:absolute;left:0;bottom:-5px;width:0;height:1px;background:#ff8b62;transition:width .3s ease}
nav a:hover::after{width:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cr-reveal,.cr-letter{opacity:1;transform:none;filter:none;transition:none}.cr-float{animation:none}.cr-track{animation:none}#cr-glow{display:none}}
</style>

<script id="chaithra-motion-sites-engine">
(()=>{
 const start=()=>{
  const root=document.querySelector('#root'); if(!root||window.__crMotion)return; window.__crMotion=true;
  const $=(s,p=document)=>Array.from(p.querySelectorAll(s));
  const progress=document.createElement('div');progress.id='cr-progress';document.body.appendChild(progress);
  const glow=document.createElement('div');glow.id='cr-glow';document.body.appendChild(glow);

  // Plain dark-red background overrides
  document.documentElement.style.background='#170307';document.body.style.background='#170307';

  // Marquee strip, inserted after the hero section.
  const hero=root.querySelector('section');
  if(hero&&!root.querySelector('.cr-marquee')){
   const m=document.createElement('div');m.className='cr-marquee';
   const words=['AI / ML','WEB DEVELOPMENT','PYTHON','C++','BUILD','CREATE','LEARN','INNOVATE','PORTFOLIO'];
   m.innerHTML='<div class="cr-track">'+words.concat(words).map((w,i)=>`<span>${w} <b>✦</b></span>`).join('')+'</div>';
   hero.after(m);
  }

  // Reveal sections and content progressively.
  const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('cr-show')}),{threshold:.08,rootMargin:'0px 0px -60px'});
  $('section').forEach((s,si)=>{s.classList.add('cr-reveal');s.style.transitionDelay=Math.min(si*.08, .28)+'s';io.observe(s)});
  $('section h1,section h2,section h3,section p,section li,section button,section>a').forEach((el,i)=>{if(!el.classList.contains('cr-reveal')){el.classList.add('cr-reveal');el.style.transitionDelay=Math.min((i%8)*.06,.42)+'s';io.observe(el)}});

  // Split important headings into letters for a strong entrance animation.
  $('h1,h2').forEach((h)=>{
   if(h.dataset.crSplit)return; const text=h.textContent.trim(); if(!text||text.length>80)return; h.dataset.crSplit='1';h.classList.add('cr-heading');
   h.innerHTML=''; [...text].forEach((ch,i)=>{const s=document.createElement('span');s.className='cr-letter';s.textContent=ch===' '? '\u00a0':ch;s.style.transitionDelay=(i*28)+'ms';h.appendChild(s);io.observe(s)});
  });

  // Floating existing decorative images/icons.
  $('img').forEach((img,i)=>{if(i%2===0)img.classList.add('cr-float')});

  // Magnetic interactions.
  $('button,a').forEach(el=>{
   if(el.dataset.crMag)return;el.dataset.crMag='1';el.classList.add('cr-magnetic');
   el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`translate(${(x*10).toFixed(1)}px,${(y*8).toFixed(1)}px)`},{passive:true});
   el.addEventListener('pointerleave',()=>el.style.transform='');
  });

  // 3D tilt for portfolio cards.
  const cards=$('#projects > div > div > div, [id="projects"] .rounded-2xl');
  cards.forEach((card,i)=>{
   if(card.dataset.crCard)return;card.dataset.crCard='1';card.classList.add('cr-card','cr-project-wrap');
   card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(1100px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*5).toFixed(2)}deg) translateY(-6px)`},{passive:true});
   card.addEventListener('pointerleave',()=>card.style.transform='');
  });

  let tx=innerWidth/2,ty=innerHeight/2,cx=tx,cy=ty;
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY},{passive:true});const tick=()=>{cx+=(tx-cx)*.14;cy+=(ty-cy)*.14;glow.style.left=cx+'px';glow.style.top=cy+'px';requestAnimationFrame(tick)};tick()}else glow.remove();

  let ticking=false;
  const scroll=()=>{const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?scrollY/max*100:0)+'%';
   cards.forEach((card,i)=>{const r=card.getBoundingClientRect();const center=innerHeight*.55;const d=Math.max(0,Math.min(1,(center-r.top)/Math.max(1,innerHeight*.85)));const scale=1-i*.025-d*(.04+i*.01);if(!card.matches(':hover'))card.style.transform=`scale(${Math.max(.92,scale)})`});ticking=false};
  addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(scroll);ticking=true}},{passive:true});scroll();
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(start,120));else setTimeout(start,120);
})();
</script>

@keyframes crGhost{from{transform:translate(-2%,-50%) scale(1)}to{transform:translate(-9%,-50%) scale(1.04)}}

<script id="chaithra-cinematic-hero-engine">
(()=>{
 const mount=()=>{
  const root=document.getElementById('root'); if(!root||root.dataset.cinemaHero)return;
  const hero=root.querySelector('section'); if(!hero)return;
  /* Remove the original React header/navigation so the cinematic hero owns the only nav. */
  root.querySelectorAll('header, nav').forEach(el => {
    if (!hero.contains(el)) el.remove();
  });
  root.dataset.cinemaHero='1';
  hero.id='home'; hero.className='cr-cinema';
  hero.innerHTML=`
   <div class="cr-noise"></div>
   <nav class="cr-nav"><a class="cr-brand" href="#home">Chaithra<span>.</span></a><div class="cr-navlinks">
    <a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#education">Education</a><a href="#achievements">Achievements</a><a href="#contact">Contact</a>
   </div></nav>
   <div class="cr-ghost-name" aria-hidden="true">CHAITHRA</div>
   <div class="cr-light"></div><div class="cr-light two"></div>
   <div class="cr-hero-copy">
    <div class="cr-kicker">AI / ML ENGINEER</div>
    <h1 class="cr-name">CHAITHRA</h1>
    <div class="cr-sub">Building <b>Intelligent</b><br>Systems.</div>
    <p class="cr-description">I’m Chaithra, a CSE-AIML engineering student passionate about AI, Machine Learning and creating technology that makes a difference.</p>
    <div class="cr-actions"><a class="cr-btn primary" href="#projects">View My Projects <span>→</span></a><a class="cr-btn" href="#contact">Contact Me</a></div>
   </div>
   <div class="cr-portrait-stage" data-depth="1">
    <div class="cr-halo"></div><div class="cr-orbit"></div><div class="cr-orbit two"></div>
    <div class="cr-card3d">
      <div class="cr-face"><img src="./assets/chaithra-portrait.png" alt="Chaithra portfolio portrait"></div>
      <div class="cr-face back"><img src="./assets/chaithra-portrait.png" alt="Chaithra portfolio portrait"></div>
    </div>
   </div>
   <div class="cr-index"><span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span><b></b></div>
   <div class="cr-scroll"><i></i>SCROLL TO EXPLORE</div>`;
  const stage=hero.querySelector('.cr-portrait-stage');
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
   hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;stage.style.transform=`translate(${x*16}px,calc(-47% + ${y*-10}px)) rotateY(${x*3}deg)`},{passive:true});
   hero.addEventListener('pointerleave',()=>stage.style.transform='translateY(-47%)');
  }
  hero.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{const id=a.getAttribute('href');if(id&&id.startsWith('#')){const el=document.querySelector(id);if(el){e.preventDefault();el.scrollIntoView({behavior:'smooth'});}}}));
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,650));else setTimeout(mount,650);
})();
</script>
